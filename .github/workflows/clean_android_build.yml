name: Test Android Build

on:
  workflow_dispatch:

env:
  ROM_MANIFEST: https://github.com/LineageOS/android.git
  ROM_BRANCH: lineage-23.2
  CCACHE_SIZE: 20G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            curl \
            python3 \
            python3-pip \
            unzip \
            zip \
            rsync \
            bc \
            bison \
            flex \
            build-essential \
            ccache \
            clang \
            lld \
            libssl-dev \
            libxml2-utils \
            xsltproc \
            libncurses-dev \
            zlib1g-dev \
            liblz4-tool \
            libxml2 \
            openjdk-17-jdk

          git lfs install

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          export PATH="$HOME/bin:$PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          repo --version

      - name: Check runner resources
        run: |
          echo "===== CPU ====="
          nproc

          echo "===== RAM ====="
          free -h

          echo "===== DISK ====="
          df -h /

      - name: Configure ccache
        run: |
          mkdir -p "$HOME/.ccache"

          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size="${CCACHE_SIZE}"
          ccache --set-config=compression=true

          ccache --zero-stats
          ccache --show-config

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-lineage-23.2-${{ runner.arch }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-lineage-23.2-${{ runner.arch }}-${{ github.ref_name }}-
            ccache-lineage-23.2-${{ runner.arch }}-

      - name: Initialize LineageOS
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"

          repo init \
            -u "$ROM_MANIFEST" \
            -b "$ROM_BRANCH" \
            --git-lfs \
            --no-clone-bundle

      - name: Sync LineageOS
        run: |
          cd "$GITHUB_WORKSPACE/android"

          repo sync \
            -c \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j"$(nproc)"

      - name: Source statistics
        run: |
          cd "$GITHUB_WORKSPACE/android"

          echo "===== DISK ====="
          df -h

          echo "===== SOURCE SIZE ====="
          du -sh . || true

          echo "===== .repo SIZE ====="
          du -sh .repo || true

          echo "===== PROJECT COUNT ====="
          repo list | wc -l

      - name: Setup Android environment
        run: |
          cd "$GITHUB_WORKSPACE/android"

          source build/envsetup.sh

          echo "Android environment initialized"

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE/android"

          source build/envsetup.sh

          echo "Environment OK"

      - name: Ccache statistics
        if: always()
        run: |
          ccache --show-stats || true
          ccache --show-config || true

      - name: System information
        if: always()
        run: |
          echo "===== CPU ====="
          nproc

          echo "===== MEMORY ====="
          free -h

          echo "===== DISK ====="
          df -h
