plugins {
    id 'com.android.application'
}

android {
    namespace 'org.fortressos.telemetry'
    compileSdk 36

    defaultConfig {
        applicationId 'org.fortressos.telemetry'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
